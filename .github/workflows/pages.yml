
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build project
        run: |
          cd efsane-proje
          node build.js

      - name: Prepare project
        run: |
          mkdir -p public/efsane-proje
          cp efsane-proje/dist/index.html public/efsane-proje/index.html
          cp efsane-proje/dist/manifest.json public/efsane-proje/manifest.json
          cp efsane-proje/dist/sw.js public/efsane-proje/sw.js
          cp -r efsane-proje/ses public/efsane-proje/ses

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
